# Redis Cluster: 6 nodes (3 masters + 3 replicas), Bitnami image. Versions in .env
# Only redis-node-0 is published on localhost:6379

x-redis-node: &redis-node
  image: ${REDIS_IMAGE}:${REDIS_VERSION}

x-redis-env: &redis-env
  ALLOW_EMPTY_PASSWORD: "yes"
  REDIS_AOF_ENABLED: "no"
  REDIS_NODES: redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5

services:
  redis-node-0:
    <<: *redis-node
    ports: ["6379:6379"]
    volumes: [redis-cluster_data-0:/bitnami/redis/data]
    environment: *redis-env

  redis-node-1:
    <<: *redis-node
    volumes: [redis-cluster_data-1:/bitnami/redis/data]
    environment: *redis-env

  redis-node-2:
    <<: *redis-node
    volumes: [redis-cluster_data-2:/bitnami/redis/data]
    environment: *redis-env

  redis-node-3:
    <<: *redis-node
    volumes: [redis-cluster_data-3:/bitnami/redis/data]
    environment: *redis-env

  redis-node-4:
    <<: *redis-node
    volumes: [redis-cluster_data-4:/bitnami/redis/data]
    environment: *redis-env

  redis-node-5:
    <<: *redis-node
    volumes: [redis-cluster_data-5:/bitnami/redis/data]
    environment: *redis-env

  redis-cluster-init:
    <<: *redis-node
    depends_on: [redis-node-0, redis-node-1, redis-node-2, redis-node-3, redis-node-4, redis-node-5]
    environment:
      <<: *redis-env
      REDIS_CLUSTER_REPLICAS: "1"
      REDIS_CLUSTER_CREATOR: "yes"

volumes:
  redis-cluster_data-0:
  redis-cluster_data-1:
  redis-cluster_data-2:
  redis-cluster_data-3:
  redis-cluster_data-4:
  redis-cluster_data-5:
