# ~/.config/tmux/tmux.conf -> symlink to dotfiles/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 50000

# Click a tab to switch to it, scroll with the wheel
set -g mouse on

# Tabs numbered from 1 and renumbered when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Highlight tabs with new output (a VPN reconnect, a port-forward that dropped...)
setw -g monitor-activity on
set -g visual-activity off

# Green on black, matching the Retro terminal profile
set -g status-style "bg=black,fg=green"
set -g status-left ""
set -g status-right "%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=green,fg=black,bold"
setw -g window-status-activity-style "fg=black,bg=yellow"
set -g message-style "bg=green,fg=black"
set -g pane-border-style "fg=green"
set -g pane-active-border-style "fg=brightgreen"
